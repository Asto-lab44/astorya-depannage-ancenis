<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D2048"/>
      <stop offset="100%" stop-color="#1B3878"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8B5C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid pattern (subtle) -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- Decorative blob -->
  <circle cx="1080" cy="540" r="280" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="950" cy="120" r="180" fill="url(#accent)" opacity="0.10"/>

  <!-- Brand mark -->
  <g transform="translate(80, 80)">
    <rect width="92" height="92" rx="22" fill="url(#accent)"/>
    <text x="46" y="68" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#0D2048" text-anchor="middle">A</text>
  </g>

  <!-- Brand name -->
  <text x="200" y="138" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#FFFFFF">Astorya</text>
  <text x="200" y="170" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#9BB0D4" letter-spacing="1">SOCIÉTÉ INFORMATIQUE — ANCENIS</text>

  <!-- Tagline -->
  <text x="80" y="330" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#FFFFFF">Votre informatique,</text>
  <text x="80" y="410" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#FFFFFF">pilotée à <tspan fill="#FF8B5C">Ancenis</tspan>.</text>

  <!-- Subtitle -->
  <text x="80" y="465" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#C7D2E8">Infogérance · Cybersécurité · Cloud · Téléphonie</text>

  <!-- Bottom bar -->
  <rect x="80" y="540" width="1040" height="2" fill="#FF6B35" opacity="0.6"/>

  <!-- Footer -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Intervention sous 4 h</text>
    <text x="240" y="0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9BB0D4">·</text>
    <text x="260" y="0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Depuis 2010</text>
    <text x="430" y="0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9BB0D4">·</text>
    <text x="450" y="0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">02 85 52 13 95</text>
  </g>

  <text x="1120" y="600" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9BB0D4" text-anchor="end">ancenis.astorya.fr</text>
</svg>
